name: Test basic usage (latest, dry-run)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          swift-version: 'latest'
          dry-run: 'true'
      - name: Assert swift-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.swift-version }}
        run: |
          echo "actual swift-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected swift-version output to be non-empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert toolchain output is set
        env:
          ACTUAL: ${{ steps.action.outputs.toolchain }}
        run: |
          echo "actual toolchain: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected toolchain output to be non-empty"
            exit 1
          fi
          echo "PASS"
