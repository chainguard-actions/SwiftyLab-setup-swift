name: Test setup-swift development snapshot
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          swift-version: 'latest'
          development: 'true'
          dry-run: 'true'
          cache-snapshot: 'false'
      - name: Assert swift-version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.swift-version }}
        run: |
          echo "actual swift-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: swift-version output is empty for development snapshot"
            exit 1
          fi
          echo "PASS: swift-version output is set to $ACTUAL"
      - name: Assert toolchain output is set and valid JSON
        env:
          ACTUAL: ${{ steps.setup.outputs.toolchain }}
        run: |
          echo "actual toolchain: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: toolchain output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | python3 -m json.tool > /dev/null 2>&1; then
            echo "FAIL: toolchain output is not valid JSON"
            exit 1
          fi
          echo "PASS: toolchain output is valid JSON for development snapshot"
