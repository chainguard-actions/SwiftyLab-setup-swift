name: Test setup-swift specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          swift-version: '5.10'
          dry-run: 'true'
          cache-snapshot: 'false'
      - name: Assert swift-version output matches requested version
        env:
          ACTUAL: ${{ steps.setup.outputs.swift-version }}
        run: |
          echo "actual swift-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: swift-version output is empty"
            exit 1
          fi
          # Version 5.10 should resolve to a 5.10.x version
          if ! echo "$ACTUAL" | grep -qE '^5\.10'; then
            echo "FAIL: expected version starting with 5.10, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: swift-version output $ACTUAL starts with 5.10"
      - name: Assert toolchain output is set and valid JSON
        env:
          ACTUAL: ${{ steps.setup.outputs.toolchain }}
        run: |
          echo "actual toolchain: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: toolchain output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | python3 -m json.tool > /dev/null 2>&1; then
            echo "FAIL: toolchain output is not valid JSON"
            exit 1
          fi
          echo "PASS: toolchain output is valid JSON for version 5.10"
