name: Test dry-run with specific Swift version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          swift-version: '5.10'
          dry-run: 'true'
      - name: Assert swift-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.swift-version }}
        run: |
          echo "actual swift-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: swift-version output is empty"
            exit 1
          fi
          echo "PASS: swift-version=$ACTUAL"
      - name: Assert swift-version starts with 5.10
        env:
          ACTUAL: ${{ steps.action.outputs.swift-version }}
        run: |
          echo "actual swift-version: $ACTUAL"
          if [[ "$ACTUAL" != 5.10* ]]; then
            echo "FAIL: expected swift-version to start with 5.10, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: swift-version starts with 5.10"
      - name: Assert toolchain output is valid JSON
        env:
          ACTUAL: ${{ steps.action.outputs.toolchain }}
        run: |
          echo "actual toolchain: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: toolchain output is empty"
            exit 1
          fi
          echo "$ACTUAL" | python3 -m json.tool > /dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "FAIL: toolchain output is not valid JSON"
            exit 1
          fi
          echo "PASS: toolchain is valid JSON"
