name: Test dry-run mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-swift
        uses: .
        with:
          swift-version: 'latest'
          dry-run: 'true'
      - name: Assert swift-version output is set even in dry-run
        env:
          ACTUAL: ${{ steps.setup-swift.outputs.swift-version }}
        run: |
          echo "actual swift-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: swift-version output is empty in dry-run mode"
            exit 1
          fi
          echo "PASS: swift-version is set to $ACTUAL"
      - name: Assert toolchain output is set in dry-run
        env:
          ACTUAL: ${{ steps.setup-swift.outputs.toolchain }}
        run: |
          echo "actual toolchain: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: toolchain output is empty in dry-run mode"
            exit 1
          fi
          echo "PASS: toolchain metadata is set in dry-run mode"
      - name: Assert toolchain output is valid JSON in dry-run
        env:
          ACTUAL: ${{ steps.setup-swift.outputs.toolchain }}
        run: |
          echo "actual toolchain: $ACTUAL"
          if ! echo "$ACTUAL" | python3 -c "import sys, json; json.load(sys.stdin)" 2>/dev/null; then
            echo "FAIL: toolchain output is not valid JSON in dry-run mode"
            exit 1
          fi
          echo "PASS: toolchain is valid JSON in dry-run mode"
